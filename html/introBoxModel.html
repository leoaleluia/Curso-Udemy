<!DOCTYPE html>
<html lang="pt-br ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      .sec-one{
        width: 200px;
        background-color: deeppink;
        background-image: url(https://i.pinimg.com/736x/d5/11/f1/d511f14a39e3633fba671fc2b277586d.jpg);
        background-size: cover;
        background-position: center;
        border: 10px solid black;
        border-style: solid;
        border-width: 20px; /*Configura o tamanho da morda da div */
        border-bottom-color: red;
        border-top-color: yellow;
        border-left-color: blue;
        border-right-color: black;
        margin-bottom: 5%; /*afasta a div 5% do tamanho da horizontal dela*/
        margin-left: 20%; /*Afasta um conteudo da esquerda para direita, margin-right funciona da direita para esquerda
        margin-top, afasta a div da margem da div acima dela*/
        

        padding: 20px; /*Para deixar a caixa mais gorda, ou afastar o texto das margens*/



      }  
      .sec-two{
        background-color: deepskyblue;
      }
    </style>
</head>
<body>
    <section>
        <section class="sec-one">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor itaque animi eum sequi excepturi architecto non nam, iste quisquam consequuntur inventore maiores similique veniam harum, totam nisi quis illo sed.</section>
        <section class="sec-two">2</section>
    </section>
</body>
</html>
